{{ define "main" }}
<section class="py-14 sm:py-20">
  <header class="mb-10 max-w-xl">
    <h1 class="text-balance text-[clamp(2rem,5vw,2.8rem)] font-semibold leading-[1.1] tracking-tight">{{ .Title }}</h1>
    {{ with .Description }}<p class="mt-4 text-pretty text-base leading-relaxed text-zinc-600 dark:text-zinc-300">{{ . }}</p>{{ end }}
  </header>

  {{ $journey := sort .RegularPages "Weight" }}
  <ul role="list" class="flex flex-col">
    {{ range $journey }}
    <li>
      <a href="{{ .RelPermalink }}" class="group flex items-baseline justify-between gap-4 border-l-2 border-transparent py-4 pl-4 transition-colors hover:border-accent hover:bg-zinc-100/60 dark:hover:bg-white/[0.03]">
        <div class="min-w-0">
          <h3 class="text-[15px] font-medium tracking-tight group-hover:text-accent">{{ .Title }}</h3>
          <p class="text-sm text-zinc-500 dark:text-zinc-400">{{ .Params.description }}</p>
        </div>
        {{ with .Params.dateString }}<span class="shrink-0 whitespace-nowrap font-mono text-xs text-zinc-400 dark:text-zinc-500">{{ . }}</span>{{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
