{{ define "main" }}
<section class="py-14 sm:py-20">
  <header class="mb-10 max-w-xl">
    <h1 class="text-balance text-[clamp(2rem,5vw,2.8rem)] font-semibold leading-[1.1] tracking-tight">{{ .Title }}</h1>
    {{ with .Description }}<p class="mt-4 text-pretty text-base leading-relaxed text-zinc-600 dark:text-zinc-300">{{ . }}</p>{{ end }}
    {{ with .Content }}<div class="prose mt-4 max-w-none text-sm">{{ . }}</div>{{ end }}
  </header>

  {{ $art := where .RegularPages ".Params.cover.image" "!=" nil }}
  {{ if $art }}
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
    {{ range $art }}
    <a href="{{ .RelPermalink }}" class="group relative aspect-square overflow-hidden rounded-xl border border-zinc-200 bg-zinc-100 dark:border-white/10 dark:bg-white/[0.02]">
      <img src="{{ .Params.cover.image | relURL }}" alt="{{ .Title }}" loading="lazy"
           class="size-full object-cover transition-transform duration-500 group-hover:scale-105" />
      <div class="absolute inset-0 flex items-end bg-linear-to-t from-black/70 via-black/0 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100">
        <span class="p-3 text-xs font-medium text-white">{{ .Title }}</span>
      </div>
    </a>
    {{ end }}
  </div>
  {{ else }}
  <p class="text-zinc-500 dark:text-zinc-400">No pieces yet.</p>
  {{ end }}
</section>
{{ end }}
