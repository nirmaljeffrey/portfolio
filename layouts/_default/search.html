{{ define "main" }}
<section class="py-14 sm:py-20">
  <header class="mb-8 max-w-xl">
    <h1 class="text-balance text-[clamp(2rem,5vw,2.8rem)] font-semibold leading-[1.1] tracking-tight">{{ .Title }}</h1>
    {{ with .Description }}<p class="mt-4 text-pretty text-base leading-relaxed text-zinc-600 dark:text-zinc-300">{{ . }}</p>{{ end }}
  </header>

  <div class="relative">
    <svg class="pointer-events-none absolute left-4 top-1/2 size-5 -translate-y-1/2 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" autofocus type="search" autocomplete="off" spellcheck="false"
      placeholder="{{ .Params.placeholder | default "Search…" }}"
      class="w-full rounded-2xl border border-zinc-200 bg-white py-3.5 pl-12 pr-4 text-base text-zinc-900 outline-none transition-colors placeholder:text-zinc-400 focus:border-accent focus:ring-2 focus:ring-accent/20 dark:border-white/10 dark:bg-white/[0.02] dark:text-zinc-100" />
  </div>

  <ul id="searchResults" role="list" class="mt-8 flex flex-col"></ul>
  <p id="searchEmpty" class="mt-8 hidden text-sm text-zinc-500 dark:text-zinc-400"></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
  (function () {
    var input = document.getElementById("searchInput");
    var results = document.getElementById("searchResults");
    var empty = document.getElementById("searchEmpty");
    var fuse = null;

    var opts = {
      isCaseSensitive: false,
      shouldSort: true,
      ignoreLocation: true,
      threshold: 0.4,
      minMatchCharLength: 1,
      keys: ["title", "summary", "content"],
    };

    fetch("{{ "index.json" | relURL }}")
      .then(function (r) { return r.json(); })
      .then(function (data) { fuse = new Fuse(data, opts); render(); })
      .catch(function () { empty.textContent = "Could not load the search index."; empty.classList.remove("hidden"); });

    function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

    function render() {
      var q = input.value.trim();
      results.innerHTML = "";
      if (!fuse) return;
      if (!q) { empty.classList.add("hidden"); return; }
      var found = fuse.search(q).slice(0, 20);
      if (!found.length) {
        empty.textContent = 'No results for "' + q + '".';
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");
      found.forEach(function (f) {
        var it = f.item;
        var snippet = (it.summary || it.content || "").slice(0, 140);
        results.insertAdjacentHTML("beforeend",
          '<li class="border-b border-zinc-200/70 last:border-0 dark:border-white/10">' +
            '<a href="' + it.permalink + '" class="group block py-4">' +
              '<h3 class="text-[15px] font-medium tracking-tight group-hover:text-accent">' + esc(it.title) + '</h3>' +
              (snippet ? '<p class="mt-0.5 line-clamp-2 text-sm text-zinc-500 dark:text-zinc-400">' + esc(snippet) + '…</p>' : '') +
            '</a>' +
          '</li>');
      });
    }

    input.addEventListener("input", render);
  })();
</script>
{{ end }}
