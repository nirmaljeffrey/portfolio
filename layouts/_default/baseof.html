</head>

<body class="min-h-dvh bg-zinc-50 font-sans text-zinc-900 antialiased selection:bg-accent/20 selection:text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 dark:selection:text-white">

  <div aria-hidden="true" class="nj-glow pointer-events-none fixed inset-x-0 top-0 -z-10 hidden h-[420px] dark:block"></div>
