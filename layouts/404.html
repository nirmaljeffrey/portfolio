{{ define "main" }}
<section class="flex min-h-[60vh] flex-col items-center justify-center py-20 text-center">
  <p class="font-mono text-sm uppercase tracking-[0.18em] text-accent">404</p>
  <h1 class="mt-3 text-balance text-[clamp(2rem,5vw,2.8rem)] font-semibold leading-[1.1] tracking-tight">This page wandered off.</h1>
  <p class="mt-4 max-w-md text-pretty text-base leading-relaxed text-zinc-600 dark:text-zinc-300">
    The link might be broken, or the page may have moved. Let's get you back on track.
  </p>
  <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
    <a href="{{ "/" | relURL }}" class="inline-flex items-center gap-1.5 rounded-full bg-zinc-900 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-accent dark:bg-white dark:text-zinc-900 dark:hover:bg-accent dark:hover:text-white">Go home</a>
    <a href="{{ "/projects/" | relURL }}" class="inline-flex items-center gap-1.5 rounded-full border border-zinc-300 px-5 py-2.5 text-sm font-medium text-zinc-700 transition-colors hover:border-zinc-400 hover:bg-zinc-100 dark:border-white/15 dark:text-zinc-200 dark:hover:border-white/30 dark:hover:bg-white/5">See projects</a>
  </div>
</section>
{{ end }}
